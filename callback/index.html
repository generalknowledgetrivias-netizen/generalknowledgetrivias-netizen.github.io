<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Login complete - Trivia Shorts Poster</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header><img src="/assets/logo.png" alt=""><a class="brand" href="/">General Knowledge Trivias</a></header>
<main>
<h1 id="title">Login callback</h1>
<p id="msg" class="muted">This page shows the one-time login code so it can be copied. Nothing is sent or stored.</p>
<div id="box" hidden>
  <div class="code" id="code"></div>
  <button class="btn" id="copy">Copy code</button>
  <p class="muted">The code expires in a few minutes, so use it right away.</p>
</div>
</main>
<footer><a href="/terms/">Terms of Service</a> · <a href="/privacy/">Privacy Policy</a></footer>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error") || q.get("error_description");
  if (code) {
    document.getElementById("title").textContent = "Login approved ✅";
    document.getElementById("msg").textContent = "Copy this code and paste it back into Claude Code:";
    document.getElementById("code").textContent = code;
    document.getElementById("box").hidden = false;
    document.getElementById("copy").onclick = async () => {
      await navigator.clipboard.writeText(code);
      document.getElementById("copy").textContent = "Copied!";
    };
  } else if (q.toString()) {
    document.getElementById("title").textContent = "Login was not completed";
    document.getElementById("msg").textContent = "TikTok returned these details (copy them all):";
    const lines = []; for (const [k, v] of q) lines.push(k + " = " + v);
    const NL = String.fromCharCode(10);
    document.getElementById("code").textContent = lines.join(NL);
    document.getElementById("code").style.whiteSpace = "pre-wrap";
    document.getElementById("box").hidden = false;
    document.getElementById("copy").textContent = "Copy details";
    document.getElementById("copy").onclick = async () => {
      await navigator.clipboard.writeText(lines.join(NL));
      document.getElementById("copy").textContent = "Copied!";
    };
  }
</script>
</body>
</html>
